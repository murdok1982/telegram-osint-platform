services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-telegram_osint}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator_api:
    build: ./orchestrator_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: always
    volumes:
      - ./rules:/app/rules
      - ./agents:/app/agents
      - ./reporting:/app/reporting
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-telegram_osint}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - HASH_SALT=${HASH_SALT}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - RULES_DIR=/app/rules
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - REPORT_RECEIVER=${REPORT_RECEIVER}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - app

  worker:
    build: ./orchestrator_api
    command: celery -A worker.celery_app worker --loglevel=info
    restart: always
    volumes:
      - ./rules:/app/rules
      - ./agents:/app/agents
      - ./reporting:/app/reporting
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-telegram_osint}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - HASH_SALT=${HASH_SALT}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - RULES_DIR=/app/rules
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - REPORT_RECEIVER=${REPORT_RECEIVER}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - app

  beat:
    build: ./orchestrator_api
    command: celery -A beat_worker.celery_app beat --loglevel=info
    restart: always
    volumes:
      - ./rules:/app/rules
      - ./agents:/app/agents
      - ./reporting:/app/reporting
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-telegram_osint}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - HASH_SALT=${HASH_SALT}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - RULES_DIR=/app/rules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - app

  collector:
    build: ./collector_telegram
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - ORCHESTRATOR_URL=http://orchestrator_api:8000
      - HASH_SALT=${HASH_SALT}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - MONITORED_CHATS=${MONITORED_CHATS}
    depends_on:
      orchestrator_api:
        condition: service_started
    networks:
      - app

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
  app:
    driver: bridge
